name: Bootstrap local Lean environment

on:
  workflow_dispatch:
  push:
    branches: ["proof"]
    paths:
      - ".github/workflows/bootstrap-local.yml"

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Restore Mathlib oleans
        run: lake exe cache get
      - name: Package Lean toolchain
        run: |
          tar -C "$HOME/.elan/toolchains" -I 'zstd -T0 -10' -cf lean-toolchain.tar.zst leanprover--lean4---v4.30.0
      - name: Package imported library oleans
        run: |
          find .lake/packages -path '*/.lake/build/lib/lean' -type d -print0 \
            | tar --null -T - -I 'zstd -T0 -10' -cf lean-oleans.tar.zst
          ls -lh lean-toolchain.tar.zst lean-oleans.tar.zst
      - uses: actions/upload-artifact@v4
        with:
          name: lean-toolchain-v4.30.0
          path: lean-toolchain.tar.zst
          compression-level: 0
      - uses: actions/upload-artifact@v4
        with:
          name: mathlib-v4.30.0-oleans
          path: lean-oleans.tar.zst
          compression-level: 0
