name: Lean CI

on:
  push:
    branches: ["main", "proof", "block-occupancy-counterexample", "independent-matching-occupancy-formalization"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reject placeholders and user axioms
        run: |
          if grep -RInE '(^|[^A-Za-z])(sorry|admit|axiom)([^A-Za-z]|$)' --include='*.lean' LeanQuantumQueries LeanQuantumQueries.lean; then
            echo 'Found a forbidden proof placeholder or axiom.'
            exit 1
          fi

      - name: Install Lean toolchain
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Restore mathlib cache
        run: lake exe cache get

      - name: Elaborate target file
        run: lake env lean LeanQuantumQueries/IndependentMatchingBlockOccupancy.lean
