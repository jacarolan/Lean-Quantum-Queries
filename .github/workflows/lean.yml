name: Lean CI

on:
  push:
    branches: ["main", "proof", "block-occupancy-counterexample", "independent-matching-occupancy-formalization"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lean-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Normalize finite-sum arithmetic
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('LeanQuantumQueries/IndependentMatchingRawOccupancyBound.lean')
          text = path.read_text()
          old = """          rw [Finset.mul_sum]
          ring
"""
          new = """          rw [Finset.mul_sum]
          ring_nf
"""
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'expected one target block, found {count}')
          path.write_text(text.replace(old, new, 1))
          PY
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add LeanQuantumQueries/IndependentMatchingRawOccupancyBound.lean
          git commit -m "Normalize finite-sum arithmetic"
          git push

      - name: Reject placeholders and user axioms
        run: |
          if grep -RInE '(^|[^A-Za-z])(sorry|admit|axiom)([^A-Za-z]|$)' --include='*.lean' LeanQuantumQueries LeanQuantumQueries.lean; then
            echo 'Found a forbidden proof placeholder or axiom.'
            exit 1
          fi

      - name: Install Lean toolchain
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Restore Lake directory
        id: lake-cache
        uses: actions/cache/restore@v4
        with:
          path: .lake
          key: lean-4.30.0-${{ runner.os }}-${{ hashFiles('lake-manifest.json') }}

      - name: Restore mathlib cache
        run: lake exe cache get

      - name: Build target
        run: lake build LeanQuantumQueries.IndependentMatchingCore

      - name: Save Lake directory
        if: always() && steps.lake-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .lake
          key: lean-4.30.0-${{ runner.os }}-${{ hashFiles('lake-manifest.json') }}
