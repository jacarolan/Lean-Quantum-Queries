name: Lean CI

on:
  push:
    branches: ["main", "formalization"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject placeholders and user axioms
        run: |
          if grep -RInE '(^|[^A-Za-z])(sorry|admit|axiom)([^A-Za-z]|$)' --include='*.lean' LeanQuantumQueries LeanQuantumQueries.lean; then
            echo 'Found a forbidden proof placeholder or axiom.'
            exit 1
          fi
      - uses: leanprover/lean-action@v1
        with:
          build: true
          leanchecker: true
          nanoda: true
          nanoda-allow-sorry: false
